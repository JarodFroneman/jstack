name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # Full history and annotated tags are required so the frozen Beta.1
      # Proof Plane runtime test can export its exact release boundary.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Compile
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/jstack-pycache
        run: python -m compileall -q mcp scripts tests evals
      - name: Verify generated artifacts
        run: python scripts/sync_artifacts.py --check
      - name: Verify public contract compatibility
        run: python scripts/check_contract_compatibility.py
      - name: Verify product boundaries
        run: python scripts/check_product_boundaries.py
      - name: Verify Proof Plane corpus lock
        run: python -m evals.runner.cli verify-lock
      # Proof Plane's trust-boundary tests intentionally exercise POSIX/macOS
      # ownership, modes, sockets, SSH, and absolute-path semantics. Linux and
      # macOS run that full suite; Windows still verifies the portable product.
      - name: Full unit and adversarial tests (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          chmod 700 "$TMPDIR"
          python -m unittest discover -s tests -v
      - name: Portable product tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GitHub's hosted USERPROFILE grants broader inherited access than
          # the installer's fail-closed ACL policy permits. Give the tests a
          # dedicated profile boundary with only the current runner identity.
          $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $inheritance = (
            [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
            [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
          )
          function Set-JStackTestProfileAcl {
            param(
              [string]$Path,
              [switch]$AllowAuthenticatedUsers
            )
            New-Item -ItemType Directory -Force -Path $Path | Out-Null
            $profileAcl = Get-Acl -LiteralPath $Path
            $profileAcl.SetAccessRuleProtection($true, $false)
            foreach ($existingRule in @($profileAcl.Access)) {
              [void]$profileAcl.RemoveAccessRuleSpecific($existingRule)
            }
            $profileAcl.SetOwner($currentUser)
            $profileRule = [System.Security.AccessControl.FileSystemAccessRule]::new(
              $currentUser,
              [System.Security.AccessControl.FileSystemRights]::FullControl,
              $inheritance,
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow
            )
            $profileAcl.AddAccessRule($profileRule)
            if ($AllowAuthenticatedUsers) {
              $authenticatedUsers = [System.Security.Principal.SecurityIdentifier]::new(
                'S-1-5-11'
              )
              $broadRule = [System.Security.AccessControl.FileSystemAccessRule]::new(
                $authenticatedUsers,
                [System.Security.AccessControl.FileSystemRights]::FullControl,
                $inheritance,
                [System.Security.AccessControl.PropagationFlags]::None,
                [System.Security.AccessControl.AccessControlType]::Allow
              )
              $profileAcl.AddAccessRule($broadRule)
            }
            Set-Acl -LiteralPath $Path -AclObject $profileAcl
            $appliedAcl = Get-Acl -LiteralPath $Path
            $sections = (
              [System.Security.AccessControl.AccessControlSections]::Owner -bor
              [System.Security.AccessControl.AccessControlSections]::Access
            )
            $appliedSddl = $appliedAcl.GetSecurityDescriptorSddlForm($sections)
            Write-Host ('JStack CI ACL fixture {0}: {1}' -f $Path, $appliedSddl)
          }

          $broadProfileRoot = Join-Path $env:RUNNER_TEMP 'jstack-broad-profile'
          Set-JStackTestProfileAcl -Path $broadProfileRoot -AllowAuthenticatedUsers
          $env:USERPROFILE = $broadProfileRoot
          $negativeProbe = @'
          import os
          from pathlib import Path
          from scripts import install

          try:
              install._validate_windows_install_root(Path(os.environ["USERPROFILE"]))
          except RuntimeError as exc:
              expected = "is not verifiably user-private; installation stopped safely."
              if expected not in str(exc):
                  raise AssertionError(f"unexpected ACL rejection: {exc}") from exc
          else:
              raise AssertionError("broad Windows profile ACL was accepted")
          '@
          $negativeProbe | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $profileRoot = Join-Path $env:RUNNER_TEMP 'jstack-private-profile'
          Set-JStackTestProfileAcl -Path $profileRoot
          $env:USERPROFILE = $profileRoot
          $env:JSTACK_ACL_PATH = $profileRoot
          $privateAclProbe = @'
          $ErrorActionPreference = 'Stop'
          $acl = Get-Acl -LiteralPath $env:JSTACK_ACL_PATH
          $current = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $owner = $acl.GetOwner(
            [System.Security.Principal.SecurityIdentifier]
          ).Value
          $allowed = @($current, 'S-1-5-18', 'S-1-5-32-544')
          $rules = @($acl.Access)
          if ($rules.Count -gt 16) {
            throw "JSTACK_CI_PRIVATE_ACL_TOO_MANY_ACES:$($rules.Count)"
          }
          $entries = @(
            foreach ($rule in $rules) {
              $sid = $rule.IdentityReference.Translate(
                [System.Security.Principal.SecurityIdentifier]
              ).Value
              [ordered]@{
                sid = $sid
                type = [string]$rule.AccessControlType
                rights = [string]$rule.FileSystemRights
                inherited = [bool]$rule.IsInherited
                inheritance = [string]$rule.InheritanceFlags
                propagation = [string]$rule.PropagationFlags
              }
            }
          )
          $diagnostic = [ordered]@{
            path = $env:JSTACK_ACL_PATH
            currentSid = $current
            ownerSid = $owner
            protected = [bool]$acl.AreAccessRulesProtected
            aceCount = $rules.Count
            aces = $entries
          }
          Write-Output (
            'JStack CI private ACL diagnostic: ' +
            ($diagnostic | ConvertTo-Json -Compress -Depth 4)
          )
          if (-not $acl.AreAccessRulesProtected) {
            throw 'JSTACK_CI_PRIVATE_ACL_NOT_PROTECTED'
          }
          if ($allowed -notcontains $owner) {
            throw "JSTACK_CI_PRIVATE_ACL_OWNER_REJECTED:$owner"
          }
          $allowType = [System.Security.AccessControl.AccessControlType]::Allow
          $inheritOnlyFlag = [System.Security.AccessControl.PropagationFlags]::InheritOnly
          foreach ($rule in $rules) {
            if ($rule.AccessControlType -ne $allowType) {
              continue
            }
            $sid = $rule.IdentityReference.Translate(
              [System.Security.Principal.SecurityIdentifier]
            ).Value
            $isInheritOnly = [bool](
              $rule.PropagationFlags -band $inheritOnlyFlag
            )
            $creatorOwner = (
              $sid -eq 'S-1-3-0' -and
              $isInheritOnly
            )
            if (($allowed -notcontains $sid) -and -not $creatorOwner) {
              throw "JSTACK_CI_PRIVATE_ACL_ALLOW_SID_REJECTED:$sid"
            }
          }
          '@
          $encodedProbe = [Convert]::ToBase64String(
            [Text.Encoding]::Unicode.GetBytes($privateAclProbe)
          )
          $directProbeOutput = & powershell.exe -NoLogo -NoProfile -NonInteractive -EncodedCommand $encodedProbe 2>&1
          $directProbeExit = $LASTEXITCODE
          $directProbeOutput | ForEach-Object { Write-Host $_ }
          if ($directProbeExit -ne 0) {
            throw "JSTACK_CI_PRIVATE_ACL_DIRECT_PROBE_FAILED:$directProbeExit"
          }
          $productProbe = @'
          import base64
          import os
          import subprocess

          from scripts import install

          script = install._windows_private_acl_script(
              "\nAssert-JStackPrivateAcl -Path $env:JSTACK_ACL_PATH\n"
          )
          encoded = base64.b64encode(script.encode("utf-16-le")).decode("ascii")
          command = [
              "powershell.exe",
              "-NoLogo",
              "-NoProfile",
              "-NonInteractive",
              "-EncodedCommand",
              encoded,
          ]
          for probe_label, probe_environment in (
              ("cloned-environment", dict(os.environ)),
              ("inherited-environment", None),
          ):
              options = {} if probe_environment is None else {"env": probe_environment}
              result = subprocess.run(
                  command,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=30,
                  check=False,
                  **options,
              )
              print(
                  f"JStack exact product ACL probe {probe_label} exit: "
                  f"{result.returncode}"
              )
              for stream_label, payload in (
                  ("stdout", result.stdout),
                  ("stderr", result.stderr),
              ):
                  if payload:
                      rendered = payload[:4096].decode("utf-8", errors="replace")
                      print(
                          f"JStack exact product ACL probe {probe_label} "
                          f"{stream_label}: {rendered}"
                      )
          '@
          $productProbe | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $env:TEMP = Join-Path $profileRoot 'AppData\Local\Temp'
          $env:TMP = $env:TEMP
          $env:TMPDIR = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          python -c "import os,tempfile; from pathlib import Path; from scripts import install; root=os.path.normcase(os.environ['USERPROFILE']); value=os.path.normcase(tempfile.gettempdir()); install._validate_windows_install_root(Path(value)); assert os.path.commonpath((root,value)) == root, (root,value)"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $modules = @(
            Get-ChildItem -Path tests -Filter 'test_*.py' -File |
              Where-Object { $_.Name -notlike 'test_proof_plane_*' } |
              Sort-Object -Property Name |
              ForEach-Object { "tests.$($_.BaseName)" }
          )
          if ($modules.Count -eq 0) {
            throw 'No portable Windows test modules were discovered.'
          }
          python -m unittest -v @modules
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Independent MCP smoke test
        run: python mcp/jstack/smoke_test.py
